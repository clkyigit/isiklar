name: APK derle

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Debug APK derle
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: isiklar-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Release olarak yayınla
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Isiklar.apk
          TAG="v1.0-build${{ github.run_number }}"
          gh release create "$TAG" Isiklar.apk --title "Işıklar $TAG" --notes "Otomatik derleme" --latest
